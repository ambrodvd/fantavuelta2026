*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{

.stage{ position:relative; width:100%; max-width:1180px; margin:0 auto; padding:36px 40px 44px; overflow:hidden; }

.flag-rule{ position:absolute; top:0; left:0; width:100%; height:5px; z-index:3;

.mtn-svg{ position:absolute; left:0; bottom:0; width:100%; height:210px; z-index:0; opacity:0.5; }
.header{ position:relative; z-index:2; display:flex; align-items:center; gap:22px; margin-bottom:22px; flex-wrap:wrap; }
.badge{ width:76px; height:76px; border-radius:50%; background:radial-gradient(circle at 32% 28%, #5a1522, var(--bg-deep) 70%); border:4px solid var(--gold); display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 0 0 4px rgba(242,183,5,0.14); }
.badge svg{width:42px;height:42px;}
.header-text .eyebrow{ font-family:"DejaVu Sans Condensed",sans-serif; text-transform:uppercase; letter-spacing:0.14em; font-size:13px; color:var(--gold); font-weight:700; margin:0 0 4px; }

.sponsor{ margin-left:auto; background:#fff; color:var(--red-deep); font-family:"DejaVu Sans Condensed",sans-serif; font-weight:700; letter-spacing:0.03em; font-size:20px; padding:10px 20px; border-radius:6px; display:flex; align-items:center; gap:8px; box-shadow:0 6px 18px rgba(0,0,0,0.25); }

.menu-back{ display:inline-block; margin-bottom:18px; color:var(--gold); text-decoration:none; font-family:"DejaVu Sans Condensed",sans-serif; font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:0.06em; }
.board{ position:relative; z-index:2; }
.row{ display:grid; grid-template-columns: 46px 1fr auto; align-items:center; column-gap:16px; padding:9px 18px; border-radius:8px; margin-bottom:3px; }
@media(max-width:768px){ .row{ padding:9px 10px; column-gap:8px; grid-template-columns:34px 1fr auto; } }
.row.alt{ background:var(--panel); }
.pos{ font-family:"DejaVu Sans Condensed",sans-serif; font-weight:700; font-size:19px; color:#fff; text-align:center; }
.team-block{ display:flex; flex-direction:column; min-width:0; }

.pts{ font-family:"DejaVu Sans Condensed",sans-serif; font-weight:700; font-size:20px; color:#fff; min-width:52px; text-align:right; }

.pts-label{ font-size:10.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.06em; }

.footer-note{ margin-top:22px; font-size:11.5px; color:var(--ink-dim); text-align:right; position:relative; z-index:2; }
.row.leader{ background:linear-gradient(90deg, var(--green) 0%, var(--green-deep) 100%); box-shadow:0 4px 14px rgba(47,191,106,0.28); margin-bottom:6px; }
.row.leader .pos, .row.leader .team, .row.leader .pts{ color:#052914; }

const HAS_EXTRA = false;

function esc(s){ return (s===null||s===undefined) ? '' : String(s); }

function render(){
  const stageKeys = Object.keys(DATA[0].stages).map(Number).sort((a,b)=>a-b);
  let options = '';
  stageKeys.forEach(n=>{ options += `<option value="Tappa ${n}">Tappa ${n}</option>`; });
  if(HAS_EXTRA) options += `<option value="Extra">Extra</option>`;
  options += `<option value="Totale" selected>Totale</option>`;

  const rows = DATA.map((r,i)=>{
    const isLeader = r.pos===1;
    let labelSpans = '';
    stageKeys.forEach(n=>{
      labelSpans += `<div class="pts-item stage-item" data-label="Tappa ${n}"><span class="pts">${r.stages[n]}</span><span class="pts-label">Tappa ${n}</span></div>`;
    });
    if(HAS_EXTRA){
      labelSpans += `<div class="pts-item stage-item" data-label="Extra"><span class="pts pts-extra">${r.extra}</span><span class="pts-label">Extra</span></div>`;
    }
    labelSpans += `<div class="pts-item stage-item" data-label="Totale"><span class="pts pts-totale">${r.totale}</span><span class="pts-label">Totale</span></div>`;
    return `<div class="row${isLeader?' leader':(i%2?' alt':'')}">
      <div class="pos">${r.pos}</div>
      <div class="team-block"><span class="team">${esc(r.squadra)}</span><span class="ds">${esc(r.ds)}</span></div>
      <div class="pts-block">${labelSpans}</div>
    </div>`;
  }).join('');

  document.getElementById('classifica-container').innerHTML = `
    <select class="stage-select" id="stage-select">${options}</select>
    <div class="board">${rows}</div>`;

  const select = document.getElementById('stage-select');
  function applyFilter(){
    const val = select.value;
    document.querySelectorAll('.stage-item').forEach(el=>{
      const lbl = el.dataset.label;
      el.style.display = (lbl === 'Totale' || lbl === val) ? '' : 'none';
    });
  }
  select.addEventListener('change', applyFilter);
  applyFilter();
}
render();
