<style>
:root{
  --bg-deep:#1a0509; --bg-mid:#2c0910; --bg-light:#3d0f18;
  --red:#c8102e; --red-bright:#e21836; --red-deep:#8c0a20;
  --gold:#f2b705; --gold-deep:#c8930a;
  --green:#2fbf6a; --green-deep:#1f9950;
  --lunares:#2e6bc7;
  --ink:#faf1ee; --ink-dim:#d3a9ab;
  --line: rgba(255,255,255,0.10);
  --panel: rgba(255,255,255,0.045);
  --panel-strong: rgba(255,255,255,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"DejaVu Sans","Helvetica Neue",Arial,sans-serif;
  background:
    radial-gradient(1200px 500px at 15% -10%, rgba(255,255,255,0.06), transparent 60%),
    linear-gradient(180deg,var(--bg-deep) 0%, var(--bg-mid) 40%, var(--bg-light) 75%, #4a1420 100%);
  color:var(--ink);
}
.stage{ position:relative; width:100%; max-width:1180px; margin:0 auto; padding:36px 40px 44px; overflow:hidden; }
@media(max-width:768px){ .stage{ padding:20px 14px 28px; } }
.flag-rule{ position:absolute; top:0; left:0; width:100%; height:5px; z-index:3;
  background:linear-gradient(90deg, var(--red) 0%, var(--red) 32%, var(--gold) 32%, var(--gold) 68%, var(--red) 68%, var(--red) 100%); }
.mtn-svg{ position:absolute; left:0; bottom:0; width:100%; height:210px; z-index:0; opacity:0.5; }
.header{ position:relative; z-index:2; display:flex; align-items:center; gap:22px; margin-bottom:22px; flex-wrap:wrap; }
.badge{ width:76px; height:76px; border-radius:50%; background:radial-gradient(circle at 32% 28%, #5a1522, var(--bg-deep) 70%); border:4px solid var(--gold); display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 0 0 4px rgba(242,183,5,0.14); }
.badge svg{width:42px;height:42px;}
.header-text .eyebrow{ font-family:"DejaVu Sans Condensed",sans-serif; text-transform:uppercase; letter-spacing:0.14em; font-size:13px; color:var(--gold); font-weight:700; margin:0 0 4px; }
.header-text h1{ margin:0; font-family:"DejaVu Sans Condensed",sans-serif; font-weight:700; font-size:30px; letter-spacing:0.01em; color:#fff; text-transform:uppercase; }
.header-text .sub{ margin:4px 0 0; font-size:15px; color:var(--ink-dim); }
.sponsor{ margin-left:auto; background:#fff; color:var(--red-deep); font-family:"DejaVu Sans Condensed",sans-serif; font-weight:700; letter-spacing:0.03em; font-size:20px; padding:10px 20px; border-radius:6px; display:flex; align-items:center; gap:8px; box-shadow:0 6px 18px rgba(0,0,0,0.25); }
.sponsor .dot{width:10px;height:10px;border-radius:50%;background:var(--gold-deep);}
.menu-back{ display:inline-block; margin-bottom:18px; color:var(--gold); text-decoration:none; font-family:"DejaVu Sans Condensed",sans-serif; font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:0.06em; }
.board{ position:relative; z-index:2; }
.row{ display:grid; grid-template-columns: 46px 1fr auto; align-items:center; column-gap:16px; padding:9px 18px; border-radius:8px; margin-bottom:3px; }
@media(max-width:768px){ .row{ padding:9px 10px; column-gap:8px; grid-template-columns:34px 1fr auto; } }
.row.alt{ background:var(--panel); }
.pos{ font-family:"DejaVu Sans Condensed",sans-serif; font-weight:700; font-size:19px; color:#fff; text-align:center; }
.team-block{ display:flex; flex-direction:column; min-width:0; }
.team{ font-weight:700; font-size:16.5px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ds{ font-size:12.5px; color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pts-block{ display:flex; align-items:baseline; gap:10px; justify-content:flex-end; flex-wrap:wrap; }
.pts{ font-family:"DejaVu Sans Condensed",sans-serif; font-weight:700; font-size:20px; color:#fff; min-width:52px; text-align:right; }
.pts-totale{ background:var(--gold) !important; color:#2a1f00 !important; border-radius:6px; padding:2px 10px; min-width:52px; }
.pts-extra{ background:var(--lunares) !important; color:#fff !important; border-radius:6px; padding:2px 10px; min-width:52px; }
.pts-item{ display:flex; flex-direction:column; align-items:flex-end; }
.pts-label{ font-size:10.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.06em; }
.stage-select{ font-family:"DejaVu Sans Condensed",sans-serif; font-size:15px; font-weight:700; background:var(--panel-strong); color:#fff; border:1px solid var(--line); border-radius:8px; padding:9px 14px; margin:0 0 16px; width:100%; max-width:280px; }
.footer-note{ margin-top:22px; font-size:11.5px; color:var(--ink-dim); text-align:right; position:relative; z-index:2; }

.controls{ position:relative; z-index:2; display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; align-items:center; }
.search-input{ font-family:"DejaVu Sans",sans-serif; font-size:15px; background:var(--panel-strong); color:#fff;
  border:1px solid var(--line); border-radius:8px; padding:10px 14px; flex:1 1 240px; min-width:0; }
.search-input::placeholder{ color:var(--ink-dim); }
.stage-select{ flex:0 1 220px; margin:0; }
.count-note{ font-size:12px; color:var(--ink-dim); flex-basis:100%; }
.table-wrap{ position:relative; z-index:2; overflow-x:auto; -webkit-overflow-scrolling:touch; }
table.riders{ border-collapse:separate; border-spacing:0 3px; width:100%; }
table.riders th{ font-family:"DejaVu Sans Condensed",sans-serif; text-transform:uppercase; letter-spacing:0.06em;
  font-size:11.5px; color:var(--gold); text-align:left; padding:6px 10px; white-space:nowrap; border-bottom:1px solid var(--line); }
table.riders th.sortable{ cursor:pointer; user-select:none; }
table.riders th.sortable:hover{ color:#fff; }
table.riders th .arrow{ opacity:0.45; font-size:10px; }
table.riders th.sorted .arrow{ opacity:1; color:#fff; }
table.riders td{ padding:8px 10px; font-size:14px; color:#fff; background:var(--panel); white-space:nowrap; }
table.riders tr:nth-child(even) td{ background:rgba(255,255,255,0.02); }
table.riders tr.leader td{ background:linear-gradient(90deg, var(--red-bright) 0%, var(--red-deep) 100%); color:#fff; }
table.riders td:first-child{ border-radius:8px 0 0 8px; }
table.riders td:last-child{ border-radius:0 8px 8px 0; }
td.c-pos{ font-family:"DejaVu Sans Condensed",sans-serif; font-weight:700; font-size:16px; text-align:center; }
td.c-nome{ font-weight:700; max-width:230px; overflow:hidden; text-overflow:ellipsis; }
td.c-team{ color:var(--ink-dim); font-size:12.5px; max-width:200px; overflow:hidden; text-overflow:ellipsis; }
tr.leader td.c-team{ color:rgba(255,255,255,0.8); }
td.c-num{ text-align:right; font-family:"DejaVu Sans Condensed",sans-serif; font-weight:700; }
.pill{ display:inline-block; font-family:"DejaVu Sans Condensed",sans-serif; font-weight:700; font-size:11.5px;
  border-radius:5px; padding:2px 8px; background:var(--panel-strong); color:var(--ink-dim); border:1px solid var(--line); }
.pill.fascia{ color:var(--gold); }
.pill.cat-S{ background:rgba(46,107,199,0.22); color:#8ab4f0; border-color:rgba(46,107,199,0.5); }
.pill.cat-V{ background:rgba(47,191,106,0.18); color:#7ee0a6; border-color:rgba(47,191,106,0.45); }
.tot-badge{ background:var(--gold); color:#2a1f00; border-radius:6px; padding:2px 10px; display:inline-block; min-width:46px; text-align:right; }
.ex-badge{ background:var(--lunares); color:#fff; border-radius:6px; padding:2px 10px; display:inline-block; min-width:40px; text-align:right; }
.ex-zero{ color:var(--ink-dim); font-weight:400; }
tr.out td.c-nome{ color:var(--red-bright); text-decoration:line-through; }
tr.out.leader td.c-nome{ color:#fff; }
.badge-out{ font-family:"DejaVu Sans Condensed",sans-serif; font-size:9.5px; font-weight:700; letter-spacing:0.05em;
  background:var(--red-bright); color:#fff; border-radius:4px; padding:2px 5px; margin-left:6px; vertical-align:middle; text-decoration:none; display:inline-block; }
td.c-stage{ text-align:right; font-family:"DejaVu Sans Condensed",sans-serif; color:var(--ink-dim); }
td.c-stage.hit{ color:var(--gold); font-weight:700; }
.empty-note{ padding:18px 4px; color:var(--ink-dim); font-size:14px; }
@media(max-width:768px){
  table.riders td{ font-size:14.5px; padding:8px 8px; }
  td.c-nome{ max-width:150px; }
  td.c-team{ max-width:130px; font-size:12.5px; }
  .search-input{ font-size:16px; }
}

</style></head>

 "6": 0, "7": 0, "8": 0, "9": 0, "10": null, "11": null, "12": null, "13": null, "14": null, "15": null, "16": null, "17": null, "18": null, "19": null, "20": null, "21": null}, "extra": 0, "totale": 0, "ritirato": true, "tappa_rit": 10}, {"pos": 173, "nome": "VALTER Attila", "team": "Bahrain - Victorious", "fascia": "F", "categoria": "", "stages": {"1": 0, "2": 0, "4": 0, "5": 0, "6": 0, "7": 0, "8": 0, "9": 0, "10": 0, "11": 0, "12": 0, "13": 0, "14": 0, "15": 0, "16": 0, "17": 0, "18": 0, "19": 0, "20": 0, "21": 0}, "extra": 0, "totale": 0}, {"pos": 174, "nome": "VAN BEKKUM Darren", "team": "XDS Astana Team", "fascia": "F", "categoria": "", "stages": {"1": 0, "2": 0, "4": 0, "5": 0, "6": 0, "7": 0, "8": 0, "9": 0, "10": 0, "11": 0, "12": 0, "13": 0, "14": 0, "15": 0, "16": 0, "17": 0, "18": 0, "19": 0, "20": 0, "21": 0}, "extra": 0, "totale": 0}, {"pos": 175, "nome": "VAN BOVEN Luca", "team": "Lotto Intermarché", "fascia": "F", "categoria": "", "stages": {"1": 0, "2": 0, "4": 0, "5": 0, "6": 0, "7": 0, "8": 0, "9": 0, "10": null, "11": null, "12": null, "13": null, "14": null, "15": null, "16": null, "17": null, "18": null, "19": null, "20": null, "21": null}, "extra": 0, "totale": 0, "ritirato": true, "tappa_rit": 10}];
const STAGES = Object.keys(DATA[0].stages).map(Number).sort((a,b)=>a-b);

function esc(s){ return (s===null||s===undefined) ? '' : String(s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

const COLS = [
  {key:'pos',    label:'Pos',  type:'num',  cls:'c-pos'},
  {key:'nome',   label:'Corridore', type:'str', cls:'c-nome'},
  {key:'team',   label:'Squadra',   type:'str', cls:'c-team'},
  {key:'fascia', label:'Fascia',    type:'str', cls:'c-pill'},
  {key:'categoria', label:'Cat.',   type:'str', cls:'c-pill'},
  {key:'extra',  label:'Extra', type:'num',  cls:'c-num'},
  {key:'totale', label:'Totale',type:'num',  cls:'c-num'}
];

let sortKey = 'pos', sortDir = 1, stageMode = 'none';

/* ---- select tappe, costruita dalle chiavi di stages ---- */
const sel = document.getElementById('stage-select');
let opts = '<option value="none" selected>Tappe: nascoste</option><option value="all">Tappe: tutte</option>';
STAGES.forEach(n=>{ opts += `<option value="${n}">Solo Tappa ${n}</option>`; });
sel.innerHTML = opts;

function visibleStages(){
  if(stageMode==='none') return [];
  if(stageMode==='all') return STAGES;
  return [Number(stageMode)];
}

function renderHead(){
  const vs = visibleStages();
  let h = COLS.map(c=>{
    const isS = c.key===sortKey;
    const arrow = isS ? (sortDir===1 ? '▲' : '▼') : '↕';
    return `<th class="sortable${isS?' sorted':''}" data-key="${c.key}">${c.label} <span class="arrow">${arrow}</span></th>`;
  });
  // le colonne tappa sono inserite prima di Extra/Totale
  const stageTh = vs.map(n=>`<th class="sortable${sortKey==='st'+n?' sorted':''}" data-key="st${n}">T${n} <span class="arrow">${sortKey==='st'+n?(sortDir===1?'▲':'▼'):'↕'}</span></th>`);
  h.splice(5, 0, ...stageTh);
  document.getElementById('thead').innerHTML = `<tr>${h.join('')}</tr>`;
  document.querySelectorAll('th.sortable').forEach(th=>{
    th.addEventListener('click', ()=>{
      const k = th.dataset.key;
      if(k===sortKey){ sortDir = -sortDir; }
      else { sortKey = k; sortDir = (k==='nome'||k==='team'||k==='fascia'||k==='categoria') ? 1 : (k==='pos' ? 1 : -1); }
      render();
    });
  });
}

function valueOf(r, key){
  if(key.startsWith('st')) { const v = r.stages[key.slice(2)]; return v===null ? -1 : v; }
  if(key==='categoria') return r.categoria === 0 ? '' : String(r.categoria);
  return r[key];
}

function render(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const vs = visibleStages();
  let rows = DATA.filter(r => !q || r.nome.toLowerCase().includes(q) || (r.team||'').toLowerCase().includes(q));

  const col = COLS.find(c=>c.key===sortKey);
  const isStr = col && col.type==='str';
  rows = rows.slice().sort((a,b)=>{
    const va = valueOf(a,sortKey), vb = valueOf(b,sortKey);
    let cmp;
    if(isStr) cmp = String(va).localeCompare(String(vb), 'it');
    else cmp = (va||0) - (vb||0);
    if(cmp===0) cmp = a.pos - b.pos;
    return cmp * sortDir;
  });

  renderHead();

  document.getElementById('tbody').innerHTML = rows.map(r=>{
    const cat = (r.categoria===0 || r.categoria==='') ? '' : `<span class="pill cat-${esc(r.categoria)}">${esc(r.categoria)}</span>`;
    const fascia = r.fascia ? `<span class="pill fascia">${esc(r.fascia)}</span>` : '';
    const out = r.ritirato ? `<span class="badge-out" title="Ritirato alla tappa ${r.tappa_rit}">RIT. T${r.tappa_rit}</span>` : '';
    const stageTds = vs.map(n=>{
      const v = r.stages[n];
      if(v===null) return `<td class="c-stage">–</td>`;
      return `<td class="c-stage${v>0?' hit':''}">${v}</td>`;
    });
    const tds = [
      `<td class="c-pos">${r.pos}</td>`,
      `<td class="c-nome">${esc(r.nome)}${out}</td>`,
      `<td class="c-team">${esc(r.team)}</td>`,
      `<td>${fascia}</td>`,
      `<td>${cat}</td>`,
      ...stageTds,
      `<td class="c-num"><span class="${r.extra>0?'ex-badge':'ex-zero'}">${r.extra}</span></td>`,
      `<td class="c-num"><span class="tot-badge">${r.totale}</span></td>`
    ];
    return `<tr class="${r.pos===1?'leader ':''}${r.ritirato?'out':''}">${tds.join('')}</tr>`;
  }).join('');

  document.getElementById('empty-note').style.display = rows.length ? 'none' : '';
  document.getElementById('count-note').textContent =
    `${rows.length} corridori su ${DATA.length}` + (q ? ` · filtro "${q}"` : '');
}

document.getElementById('search').addEventListener('input', render);
sel.addEventListener('change', ()=>{ stageMode = sel.value; render(); });
render();
</script>
