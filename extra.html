<!doctype html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fanta Vuelta 2026™️ · Extra</title>
<style>
:root{
  --bg-deep:#1a0509; --bg-mid:#2c0910; --bg-light:#3d0f18;
  --red:#c8102e; --red-bright:#e21836; --red-deep:#8c0a20;
  --gold:#f2b705; --gold-deep:#c8930a;
  --green:#2fbf6a; --green-deep:#1f9950;
  --lunares:#2e6bc7;
  --ink:#faf1ee; --ink-dim:#d3a9ab;
  --line: rgba(255,255,255,0.10);
  --panel: rgba(255,255,255,0.045);
  --panel-strong: rgba(255,255,255,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"DejaVu Sans","Helvetica Neue",Arial,sans-serif;
  background:
    radial-gradient(1200px 500px at 15% -10%, rgba(255,255,255,0.06), transparent 60%),
    linear-gradient(180deg,var(--bg-deep) 0%, var(--bg-mid) 40%, var(--bg-light) 75%, #4a1420 100%);
  color:var(--ink);
}
.stage{ position:relative; width:100%; max-width:1180px; margin:0 auto; padding:36px 40px 44px; overflow:hidden; }
@media(max-width:768px){ .stage{ padding:20px 14px 28px; } }
.flag-rule{ position:absolute; top:0; left:0; width:100%; height:5px; z-index:3;
  background:linear-gradient(90deg, var(--red) 0%, var(--red) 32%, var(--gold) 32%, var(--gold) 68%, var(--red) 68%, var(--red) 100%); }
.mtn-svg{ position:absolute; left:0; bottom:0; width:100%; height:210px; z-index:0; opacity:0.5; }
.header{ position:relative; z-index:2; display:flex; align-items:center; gap:22px; margin-bottom:22px; flex-wrap:wrap; }
.badge{ width:76px; height:76px; border-radius:50%; background:radial-gradient(circle at 32% 28%, #5a1522, var(--bg-deep) 70%); border:4px solid var(--gold); display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 0 0 4px rgba(242,183,5,0.14); }
.badge svg{width:42px;height:42px;}
.header-text .eyebrow{ font-family:"DejaVu Sans Condensed",sans-serif; text-transform:uppercase; letter-spacing:0.14em; font-size:13px; color:var(--gold); font-weight:700; margin:0 0 4px; }
.header-text h1{ margin:0; font-family:"DejaVu Sans Condensed",sans-serif; font-weight:700; font-size:30px; letter-spacing:0.01em; color:#fff; text-transform:uppercase; }
.header-text .sub{ margin:4px 0 0; font-size:15px; color:var(--ink-dim); }
.sponsor{ margin-left:auto; background:#fff; color:var(--red-deep); font-family:"DejaVu Sans Condensed",sans-serif; font-weight:700; letter-spacing:0.03em; font-size:20px; padding:10px 20px; border-radius:6px; display:flex; align-items:center; gap:8px; box-shadow:0 6px 18px rgba(0,0,0,0.25); }
.sponsor .dot{width:10px;height:10px;border-radius:50%;background:var(--gold-deep);}
.menu-back{ display:inline-block; margin-bottom:18px; color:var(--gold); text-decoration:none; font-family:"DejaVu Sans Condensed",sans-serif; font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:0.06em; }
.board{ position:relative; z-index:2; }
.row{ display:grid; grid-template-columns: 46px 1fr auto; align-items:center; column-gap:16px; padding:9px 18px; border-radius:8px; margin-bottom:3px; }
@media(max-width:768px){ .row{ padding:9px 10px; column-gap:8px; grid-template-columns:34px 1fr auto; } }
.row.alt{ background:var(--panel); }
.pos{ font-family:"DejaVu Sans Condensed",sans-serif; font-weight:700; font-size:19px; color:#fff; text-align:center; }
.team-block{ display:flex; flex-direction:column; min-width:0; }
.team{ font-weight:700; font-size:16.5px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ds{ font-size:12.5px; color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pts-block{ display:flex; align-items:baseline; gap:10px; justify-content:flex-end; flex-wrap:wrap; }
.pts{ font-family:"DejaVu Sans Condensed",sans-serif; font-weight:700; font-size:20px; color:#fff; min-width:52px; text-align:right; }
.pts-totale{ background:var(--gold) !important; color:#2a1f00 !important; border-radius:6px; padding:2px 10px; min-width:52px; }
.pts-extra{ background:var(--lunares) !important; color:#fff !important; border-radius:6px; padding:2px 10px; min-width:52px; }
.pts-item{ display:flex; flex-direction:column; align-items:flex-end; }
.pts-label{ font-size:10.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.06em; }
.stage-select{ font-family:"DejaVu Sans Condensed",sans-serif; font-size:15px; font-weight:700; background:var(--panel-strong); color:#fff; border:1px solid var(--line); border-radius:8px; padding:9px 14px; margin:0 0 16px; width:100%; max-width:280px; }
.footer-note{ margin-top:22px; font-size:11.5px; color:var(--ink-dim); text-align:right; position:relative; z-index:2; }

.row.leader{ background:linear-gradient(90deg, var(--red-bright) 0%, var(--red-deep) 100%); box-shadow:0 4px 14px rgba(226,24,54,0.30); margin-bottom:6px; }
.row.leader .pos, .row.leader .team, .row.leader .pts{ color:#fff; }
.row.leader .ds{ color:#fff; opacity:0.8; }
.tab-nav{ position:relative; z-index:2; display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px; }
.tab-btn{ font-family:"DejaVu Sans Condensed",sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;
  font-size:14px; padding:10px 16px; border-radius:9px; border:1px solid var(--line);
  background:var(--panel); color:var(--ink-dim); cursor:pointer; white-space:normal; }
.tab-btn.active{ background:linear-gradient(90deg, var(--red-bright), var(--red-deep)); color:#fff; border-color:transparent; }
.tab-panel{ display:none; position:relative; z-index:2; }
.tab-panel.active{ display:block; }
.panel{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px 10px; }
.panel h3{ margin:0 0 10px; font-family:"DejaVu Sans Condensed",sans-serif; text-transform:uppercase; letter-spacing:0.06em; font-size:14px; color:var(--gold); border-bottom:1px solid var(--line); padding-bottom:8px; }
.maglie-grid{ display:grid; grid-template-areas: "rossa" "pois" "bianca" "verde"; grid-template-columns:1fr; gap:16px; }
@media(min-width:769px){
  .maglie-grid{ grid-template-areas: "rossa bianca" "rossa verde" "pois pois"; grid-template-columns:1.2fr 1fr; }
}
.area-rossa{ grid-area:rossa; } .area-pois{ grid-area:pois; }
.area-bianca{ grid-area:bianca; } .area-verde{ grid-area:verde; }
.mini-row{ display:grid; grid-template-columns:26px 1fr auto; padding:5px 10px; font-size:13.5px; border-radius:5px; }
@media(max-width:768px){ .mini-row{ font-size:15px; } }
.mini-row.alt{ background:var(--panel); }
.mini-row .mpos{ color:var(--ink-dim); font-weight:700; font-family:"DejaVu Sans Condensed",sans-serif; }
.mini-row .mname{ color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mini-row .mpts{ color:var(--gold); font-weight:700; text-align:right; }
.maglia-single{ display:flex; justify-content:space-between; gap:10px; padding:8px 10px; font-size:15px; }
.maglia-single .mgname{ color:#fff; font-weight:700; }
.maglia-single .mgpts{ color:var(--gold); font-weight:700; white-space:nowrap; }
.team-grid{ display:grid; grid-template-columns:1fr; gap:14px; position:relative; z-index:2; }
@media(min-width:1025px){ .team-grid{ grid-template-columns:repeat(3, 1fr); } }
.team-card{ background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
.team-card.leader-card{ border-color:var(--red-bright); box-shadow:0 0 0 1px rgba(226,24,54,0.40); }
.team-card-head{ display:flex; justify-content:space-between; align-items:center; padding:10px 14px; background:var(--panel-strong); }
.team-card.leader-card .team-card-head{ background:linear-gradient(90deg, var(--red-bright), var(--red-deep)); }
.team-card-head .tname{ font-weight:700; font-size:14.5px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
@media(max-width:1024px){ .team-card-head .tname{ font-size:16px; } }
.team-card-head .tpts{ font-family:"DejaVu Sans Condensed",sans-serif; font-weight:700; font-size:17px; color:var(--gold); flex-shrink:0; margin-left:8px; }
@media(max-width:1024px){ .team-card-head .tpts{ font-size:19px; } }
.team-card.leader-card .tpts{ color:#fff; }
.team-card-ds{ font-size:11px; color:var(--ink-dim); padding:6px 14px 0; }
@media(max-width:1024px){ .team-card-ds{ font-size:12.5px; } }
.team-card.leader-card .team-card-ds{ color:rgba(255,255,255,0.8); background:linear-gradient(90deg, var(--red-bright), var(--red-deep)); padding-top:4px; padding-bottom:6px; }
.rider-list{ padding:8px 10px 10px; }
.rider-row{ display:flex; justify-content:space-between; gap:8px; font-size:12.5px; padding:2.5px 6px; border-radius:4px; align-items:center; }
@media(max-width:1024px){ .rider-row{ font-size:14.5px; padding:4px 6px; } }
.rider-row:nth-child(even){ background:rgba(255,255,255,0.035); }
.rider-row .rname{ color:#f2dedf; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rider-row .rpts{ color:var(--gold); font-weight:700; flex-shrink:0; }
.rider-row.zero .rpts{ color:var(--ink-dim); font-weight:400; }
.rider-row.out .rname{ color:var(--red-bright); text-decoration:line-through; }
.badge-out{ font-family:"DejaVu Sans Condensed",sans-serif; font-size:10px; font-weight:700; letter-spacing:0.06em;
  background:var(--red-bright); color:#fff; border-radius:4px; padding:2px 6px; flex-shrink:0; }

</style></head>

function esc(s){ return (s===null||s===undefined) ? '' : String(s); }

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
  });
});

function renderMaglie(){
  const rossa = DATA.maglia_rossa.map((r,i)=>`<div class="mini-row${i%2?' alt':''}"><span class="mpos">${r.pos}</span><span class="mname">${esc(r.nome)}</span><span class="mpts">${r.punti}</span></div>`).join('');
  document.getElementById('tab-maglie').innerHTML = `
  <div class="maglie-grid">
    <div class="area-rossa panel"><h3>🔴 Maglia Rossa — Top 3</h3>${rossa}</div>
    <div class="area-bianca panel"><h3>⚪ Maglia Bianca</h3>
      <div class="maglia-single"><span class="mgname">${esc(DATA.maglia_bianca.nome)}</span><span class="mgpts">${DATA.maglia_bianca.punti} pt</span></div>
    </div>
    <div class="area-verde panel"><h3>🟢 Maglia Verde</h3>
      <div class="maglia-single"><span class="mgname">${esc(DATA.maglia_verde.nome)}</span><span class="mgpts">${DATA.maglia_verde.punti} pt</span></div>
    </div>
    <div class="area-pois panel"><h3>🔵 Maglia Pois (GPM)</h3>
      <div class="maglia-single"><span class="mgname">${esc(DATA.maglia_pois.nome)}</span><span class="mgpts">${DATA.maglia_pois.punti} pt</span></div>
    </div>
  </div>`;
}

function renderSquadre(){
  const leaderName = DATA.classifica_extra.slice().sort((a,b)=>a.pos-b.pos)[0].squadra;
  const cards = DATA.squadre.map(t=>{
    const isLeader = t.squadra === leaderName;
    const riders = t.riders.map(r=>{
      const cls = r.ritirato ? ' out' : (r.punti===0 ? ' zero' : '');
      const val = r.ritirato ? `<span class="badge-out">RITIRATO</span>` : `<span class="rpts">${r.punti}</span>`;
      return `<div class="rider-row${cls}"><span class="rname">${esc(r.nome)}</span>${val}</div>`;
    }).join('');
    return `<div class="team-card${isLeader?' leader-card':''}">
      <div class="team-card-head"><span class="tname">${esc(t.squadra)}</span><span class="tpts">${t.extra_totale}</span></div>
      <div class="team-card-ds">${esc(t.ds)}</div>
      <div class="rider-list">${riders}</div>
    </div>`;
  }).join('');
  document.getElementById('tab-squadre').innerHTML = `<div class="team-grid">${cards}</div>`;
}

function renderClassificaExtra(){
  const rows = DATA.classifica_extra.slice().sort((a,b)=>a.pos-b.pos);
  const html = rows.map((r,i)=>{
    const isLeader = r.pos===1;
    return `<div class="row${isLeader?' leader':(i%2?' alt':'')}">
      <div class="pos">${r.pos}</div>
      <div class="team-block"><span class="team">${esc(r.squadra)}</span><span class="ds">${esc(r.ds)}</span></div>
      <div class="pts-block"><div class="pts-item"><span class="pts pts-extra">${r.extra}</span><span class="pts-label">Extra</span></div></div>
    </div>`;
  }).join('');
  document.getElementById('tab-classifica').innerHTML = `<div class="board">${html}</div>`;
}

renderMaglie();
renderSquadre();
renderClassificaExtra();
</script>
