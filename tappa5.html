<style>
:root{

  --red-deep:#8c0a20;
  --red-bright:#e21836;
  --bg-deep:#1a0509;
  --bg-mid:#2c0910;
  --bg-light:#3d0f18;
  --gold:#f2b705;
  --gold-deep:#c8930a;
  --green:#2fbf6a;
  --green-deep:#1f9950;
  --lunares:#2e6bc7;
  --ink:#faf1ee;
  --ink-dim:#d3a9ab;
  --line: rgba(255,255,255,0.12);
  --panel: rgba(255,255,255,0.055);
  --panel-strong: rgba(255,255,255,0.10);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"DejaVu Sans","Helvetica Neue",Arial,sans-serif;
  background:
    radial-gradient(1100px 480px at 12% -8%, rgba(242,183,5,0.10), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(200,16,46,0.18), transparent 55%),
    linear-gradient(180deg,var(--bg-deep) 0%, var(--bg-mid) 40%, var(--bg-light) 75%, #4a1420 100%);
  color:var(--ink);
}
.stage{ position:relative; width:100%; max-width:1180px; margin:0 auto; padding:36px 40px 44px; overflow:hidden; }
@media(max-width:768px){ .stage{ padding:20px 14px 28px; } }
.flag-rule{ position:absolute; top:0; left:0; width:100%; height:5px; z-index:3;
  background:linear-gradient(90deg, var(--red) 0%, var(--red) 32%, var(--gold) 32%, var(--gold) 68%, var(--red) 68%, var(--red) 100%); }
.mtn-svg{ position:absolute; left:0; bottom:0; width:100%; height:210px; z-index:0; opacity:0.5; }
.header{ position:relative; z-index:2; display:flex; align-items:center; gap:22px; margin-bottom:22px; flex-wrap:wrap; }
.badge{ width:76px; height:76px; border-radius:50%; background:radial-gradient(circle at 32% 28%, #5a1522, var(--bg-deep) 70%); border:4px solid var(--gold); display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 0 0 4px rgba(242,183,5,0.14); }
.badge svg{width:42px;height:42px;}
.header-text .eyebrow{ font-family:"DejaVu Sans Condensed",sans-serif; text-transform:uppercase; letter-spacing:0.14em; font-size:13px; color:var(--gold); font-weight:700; margin:0 0 4px; }
.header-text h1{ margin:0; font-family:"DejaVu Sans Condensed",sans-serif; font-weight:700; font-size:30px; letter-spacing:0.01em; color:#fff; text-transform:uppercase; }
.header-text .sub{ margin:4px 0 0; font-size:15px; color:var(--ink-dim); }
.sponsor{ margin-left:auto; background:#fff; color:var(--red-deep); font-family:"DejaVu Sans Condensed",sans-serif; font-weight:700; letter-spacing:0.03em; font-size:20px; padding:10px 20px; border-radius:6px; display:flex; align-items:center; gap:8px; box-shadow:0 6px 18px rgba(0,0,0,0.25); }
.sponsor .dot{width:10px;height:10px;border-radius:50%;background:var(--gold-deep);}
.menu-back{ display:inline-block; margin-bottom:18px; color:var(--gold); text-decoration:none; font-family:"DejaVu Sans Condensed",sans-serif; font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:0.06em; }

/* Tab nav */
.tab-nav{ position:relative; z-index:2; display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px; }
.tab-btn{
  font-family:"DejaVu Sans Condensed",sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;
  font-size:14px; padding:10px 16px; border-radius:9px; border:1px solid var(--line);
  background:var(--panel); color:var(--ink-dim); cursor:pointer; white-space:normal;
}
.tab-btn.active{ background:linear-gradient(90deg, var(--red-bright), var(--red-deep)); color:#fff; border-color:transparent; }
.tab-panel{ display:none; position:relative; z-index:2; }
.tab-panel.active{ display:block; }

/* Card 1 — Ciclisti di Giornata */
.day-grid{
  display:grid;
  grid-template-areas: "top10" "gpm" "rossa" "sprint";
  gap:16px;
}
@media(min-width:769px){
  .day-grid{
    grid-template-columns: 1.1fr 0.9fr;
    grid-template-areas:
      "top10 rossa"
      "top10 sprint"
      "gpm   gpm";
  }
}
.area-top10{ grid-area: top10; }
.area-gpm{ grid-area: gpm; }
.area-rossa{ grid-area: rossa; }
.area-sprint{ grid-area: sprint; }

.panel{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px 10px; }
.panel h3{ margin:0 0 10px; font-family:"DejaVu Sans Condensed",sans-serif; text-transform:uppercase; letter-spacing:0.06em; font-size:14px; color:var(--gold); border-bottom:1px solid var(--line); padding-bottom:8px; display:flex; align-items:center; gap:8px; }
.panel h3 .jersey-dot{ width:12px; height:12px; border-radius:50%; display:inline-block; }
.jersey-dot.rossa{ background:var(--red-bright); }
.jersey-dot.verde{ background:var(--green); }
.jersey-dot.pois{ background:var(--lunares); }

.mini-row{ display:grid; grid-template-columns:28px 1fr auto; padding:6px 10px; font-size:14px; border-radius:5px; }
.mini-row.alt{ background:var(--panel-strong); }
.mini-row .mpos{ color:var(--ink-dim); font-weight:700; font-family:"DejaVu Sans Condensed",sans-serif; }
.mini-row .mname{ color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.mini-row .mpts{ color:var(--gold); font-weight:700; text-align:right; }
.empty-hint{ font-size:13px; color:var(--ink-dim); padding:6px 4px; font-style:italic; }

.gpm-grid{ display:grid; grid-template-columns:1fr; gap:12px; }
@media(min-width:769px) and (max-width:1024px){ .gpm-grid{ grid-template-columns:1fr 1fr; } }
@media(min-width:1025px){ .gpm-grid{ grid-template-columns:repeat(4,1fr); } }

/* Card 2 — Squadra per squadra */
.team-grid{ display:grid; grid-template-columns:1fr; gap:14px; }
@media(min-width:1025px){ .team-grid{ grid-template-columns:repeat(3, 1fr); } }
.team-card{ background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
.team-card.leader-card{ border-color:var(--red-bright); box-shadow:0 0 0 1px rgba(226,24,54,0.35); }
.team-card-head{ display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:var(--panel-strong); }
.team-card.leader-card .team-card-head{ background:linear-gradient(90deg,var(--red-bright),var(--red-deep)); }
.team-card-head .tname{ font-weight:700; font-size:16px; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.team-card-head .tpts{ font-family:"DejaVu Sans Condensed",sans-serif; font-weight:700; font-size:19px; color:var(--gold); flex-shrink:0; margin-left:8px; }
.team-card.leader-card .tpts{ color:#fff; }
.team-card-ds{ font-size:12.5px; color:var(--ink-dim); padding:7px 16px 0; }
.team-card.leader-card .team-card-ds{ color:rgba(255,255,255,0.8); background:linear-gradient(90deg,var(--red-bright),var(--red-deep)); padding-top:5px; padding-bottom:3px; }
.rider-list{ padding:9px 12px 12px; }
.rider-row{ display:flex; justify-content:space-between; gap:8px; font-size:14px; padding:3.5px 8px; border-radius:4px; }
.rider-row:nth-child(even){ background:rgba(255,255,255,0.035); }
.rider-row .rname{ color:#f2dedf; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rider-row .rpts{ color:var(--gold); font-weight:700; flex-shrink:0; }
.rider-row.zero .rpts{ color:var(--ink-dim); font-weight:400; }

/* Card 3 — Riepilogo */
.rp-row{ display:grid; grid-template-columns: 40px 1fr auto; align-items:center; column-gap:14px; padding:10px 16px; border-radius:8px; margin-bottom:3px; }
.rp-row.alt{ background:var(--panel); }
.rp-row.leader{ background:linear-gradient(90deg, var(--red-bright), var(--red-deep)); box-shadow:0 4px 14px rgba(200,16,46,0.3); margin-bottom:6px; }
.rp-row.leader .rp-pos, .rp-row.leader .rp-team, .rp-row.leader .rp-ds{ color:#fff; }
.rp-pos{ font-family:"DejaVu Sans Condensed",sans-serif; font-weight:700; font-size:18px; color:#fff; text-align:center; }
.rp-team-block{ display:flex; flex-direction:column; min-width:0; }
.rp-team{ font-weight:700; font-size:15.5px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rp-ds{ font-size:12px; color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rp-vals{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
@media(max-width:768px){ .rp-vals{ gap:5px; } .rp-row{ column-gap:8px; padding:10px 10px; } }
.rp-item{ display:flex; flex-direction:column; align-items:flex-end; }
.rp-val{ font-family:"DejaVu Sans Condensed",sans-serif; font-weight:700; font-size:18px; color:#fff; min-width:44px; text-align:right; }
.rp-lbl{ font-size:9.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.05em; }
.rp-totale{ background:var(--gold) !important; color:#241800 !important; border-radius:6px; padding:2px 9px; min-width:44px; }
.rp-piazz{ background:var(--green) !important; color:#052914 !important; border-radius:6px; padding:2px 9px; min-width:44px; }

/* Card 4/5 — classifiche */
.board{ position:relative; z-index:2; }
.row{ display:grid; grid-template-columns: 46px 1fr auto; align-items:center; column-gap:16px; padding:9px 18px; border-radius:8px; margin-bottom:3px; }
.row.alt{ background:var(--panel); }
.row.leader-red{ background:linear-gradient(90deg, var(--red-bright), var(--red-deep)); box-shadow:0 4px 14px rgba(200,16,46,0.35); margin-bottom:6px; }
.row.leader-green{ background:linear-gradient(90deg, var(--green), var(--green-deep)); box-shadow:0 4px 14px rgba(0,0,0,0.2); margin-bottom:6px; }
.row.leader-red .pos, .row.leader-red .team{ color:#fff; } .row.leader-red .ds{ color:rgba(255,255,255,0.75); }
.row.leader-green .pos, .row.leader-green .team, .row.leader-green .ds{ color:#052914; }
.pos{ font-family:"DejaVu Sans Condensed",sans-serif; font-weight:700; font-size:19px; color:#fff; text-align:center; }
.team-block{ display:flex; flex-direction:column; min-width:0; }
.team{ font-weight:700; font-size:16.5px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ds{ font-size:12.5px; color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pts-block{ display:flex; align-items:baseline; gap:10px; justify-content:flex-end; flex-wrap:wrap; }
.pts{ font-family:"DejaVu Sans Condensed",sans-serif; font-weight:700; font-size:20px; color:#fff; min-width:52px; text-align:right; }
.pts-totale{ background:var(--gold) !important; color:#241800 !important; border-radius:6px; padding:2px 10px; min-width:52px; }
.pts-item{ display:flex; flex-direction:column; align-items:flex-end; }
.pts-label{ font-size:10.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.06em; }
.stage-select{ font-family:"DejaVu Sans Condensed",sans-serif; font-size:15px; font-weight:700; background:var(--panel-strong); color:#fff; border:1px solid var(--line); border-radius:8px; padding:9px 14px; margin:0 0 16px; width:100%; max-width:280px; }

.footer-note{ margin-top:22px; font-size:11.5px; color:var(--ink-dim); text-align:right; position:relative; z-index:2; }

/* Mobile font/padding rules for tabs */
@media(max-width:768px){
  .tab-btn{ font-size:14px; padding:10px 14px; }
}
</style></head>

// Card 4 & 5: Classifica Generale / Classifica a Punti con select tappa (scala automaticamente su N tappe)
function renderClassifica(containerId, data, leaderClass){
  const stageKeys = Object.keys(data[0].stages).map(k=>parseInt(k,10)).sort((a,b)=>a-b);
  const lastKey = String(stageKeys[stageKeys.length-1]);
  let options = stageKeys.map(k=>`<option value="Tappa ${k}">Tappa ${k}</option>`).join('') + `<option value="Totale" selected>Totale</option>`;
  const rows = data.map((r,i)=>{
    const isLeader = r.pos===1;
    const totale = r.stages[lastKey];
    const stageSpans = stageKeys.map(k=>
      `<div class="pts-item stage-item" data-label="Tappa ${k}"><span class="pts">${r.stages[String(k)]}</span><span class="pts-label">Tappa ${k}</span></div>`
    ).join('');
    const totaleSpan = `<div class="pts-item stage-item" data-label="Totale"><span class="pts pts-totale">${totale}</span><span class="pts-label">Totale</span></div>`;
    return `<div class="row${isLeader?' '+leaderClass:(i%2?' alt':'')}">
      <div class="pos">${r.pos}</div>
      <div class="team-block"><span class="team">${esc(r.squadra)}</span><span class="ds">${esc(r.ds)}</span></div>
      <div class="pts-block">${stageSpans}${totaleSpan}</div>
    </div>`;
  }).join('');
  document.getElementById(containerId).innerHTML = `<select class="stage-select">${options}</select><div class="board">${rows}</div>`;
  const select = document.getElementById(containerId).querySelector('select');
  function applyFilter(){
    const val = select.value;
    document.getElementById(containerId).querySelectorAll('.stage-item').forEach(el=>{
      const lbl = el.dataset.label;
      el.style.display = (lbl === 'Totale' || lbl === val) ? '' : 'none';
    });
  }
  select.addEventListener('change', applyFilter);
  applyFilter();
}
